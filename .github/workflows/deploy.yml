name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/wisecow:latest
          ${{ secrets.DOCKER_USERNAME }}/wisecow:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create KinD Cluster
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: wisecow-cluster

    - name: Build and Load Image into KinD
      run: |
        docker build -t chandraprakashanandakumar/wisecow:latest .
        kind load docker-image chandraprakashanandakumar/wisecow:latest --name wisecow-cluster

    - name: Generate TLS Secret
      run: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout tls.key -out tls.crt -subj "/CN=wisecow.local/O=wisecow"
        kubectl create secret tls wisecow-tls-secret --cert=tls.crt --key=tls.key

    - name: Deploy Manifests
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/wisecow-deployment --timeout=60s
        kubectl get pods -o wide
        kubectl get svc
