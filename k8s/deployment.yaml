name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/wisecow:latest
          ${{ secrets.DOCKER_USERNAME }}/wisecow:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Spin up a Real Kubernetes Cluster inside GitHub Actions runner
    - name: Create KinD (Kubernetes in Docker) Cluster
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: wisecow-cluster

    # 2. TLS Secret Implementation
    - name: Generate TLS Certificate & Secret
      run: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout tls.key -out tls.crt -subj "/CN=wisecow.local/O=wisecow"
        kubectl create secret tls wisecow-tls-secret --cert=tls.crt --key=tls.key

    # 3. Dynamic Tagging: Deploy the exact image built in the previous step
    - name: Update Deployment Image Tag
      run: |
        sed -i 's|chandraprakashanandakumar/wisecow:latest|${{ secrets.DOCKER_USERNAME }}/wisecow:${{ github.sha }}|g' k8s/deployment.yaml

    # 4. Continuous Deployment: Apply all Kubernetes manifests
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml

    # 5. Verify Rollout & Cluster Health
    - name: Verify Deployment Rollout & Status
      run: |
        kubectl rollout status deployment/wisecow-deployment --timeout=180s
        echo "=== PODS STATUS ==="
        kubectl get pods -o wide
        echo "=== SERVICES STATUS ==="
        kubectl get svc
        echo "=== INGRESS STATUS ==="
        kubectl get ingress